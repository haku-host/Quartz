name: Build and publish Haku Wiki

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch:

concurrency:
  group: haku-wiki-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npm run check
      - run: npm test
      - run: npx quartz build
      - run: npm run check:wiki
      - name: Save the build for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v4'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish public folder for the wiki server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v4'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Build Haku Wiki [skip ci]"
            git push origin HEAD:v4
          fi

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/v4'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
